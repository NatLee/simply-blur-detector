# Download the training pictures from Danbooru, train the demo model, export it next to the web page
# and publish the page on GitHub Pages.
# The model card on the page links back to the run that made it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/danbooru.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # How the demo model is trained (crops teach it to judge the heat map windows).
  EPOCHS: 20
  CROPS: 2
  SEED: 1
  # The publish threshold is PUBLISH_MIN_TEST_ACCURACY in src/detector/blur_detection/config.py;
  # `export` records whether the model reaches it in the model card.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/detector/pyproject.toml
      - run: pip install -e "src/detector[export]"
      # The training pictures come from Danbooru (data/danbooru.json). The cache keeps them between
      # runs, so Danbooru is asked again only when the list changes. It is saved right after the
      # download, so a later failure (a model below the threshold, say) does not throw it away.
      - name: Restore the downloaded Danbooru pictures
        id: pictures
        uses: actions/cache/restore@v6
        with:
          path: |
            data/train/nonblur/danbooru-*
            data/test/nonblur/danbooru-*
          key: danbooru-${{ hashFiles('data/danbooru.json') }}
      - name: Download the listed pictures that are missing
        run: blur-detector fetch --data_path=data
      - name: Keep the downloaded pictures for the next run
        if: steps.pictures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/train/nonblur/danbooru-*
            data/test/nonblur/danbooru-*
          key: danbooru-${{ hashFiles('data/danbooru.json') }}
      - name: Blur them
        run: blur-detector generate --data_path=data --seed=1
      - name: Train
        run: |
          blur-detector train --data_path=data --model_path=None --model_save_path=model/web.keras \
            --epochs=$EPOCHS --crops=$CROPS --seed=$SEED
      - name: Export for the page
        run: blur-detector export --model_path=model/web.keras --data_path=data --web_dir=src/web/public
      - name: Check the model before publishing it
        run: |
          python - <<'PY'
          import json
          card = json.load(open('src/web/public/model/model-card.json'))
          gate = card['publish']
          print(json.dumps({'metrics': card['metrics'], 'publish': gate}, indent=2))
          assert gate['passes'], f"{gate['correct']} test pictures right, need {gate['needed']} ({gate['min_test_accuracy']:.0%})"
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Test the page's pipeline with this model
        working-directory: src/web
        env:
          REQUIRE_MODEL: "1"
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
